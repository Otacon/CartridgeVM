<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CartridgeVM NES</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #101014;
            color: #f6f2e8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow: hidden;
        }

        #app {
            display: grid;
            grid-template-rows: 36px minmax(0, 1fr);
            width: 100%;
            height: 100%;
        }

        #menu {
            width: 100%;
            height: 36px;
            background: #191922;
            border-bottom: 1px solid #333341;
            overflow: hidden;
        }

        #menu canvas {
            display: block;
            width: 100% !important;
            height: 36px !important;
        }

        #screenWrap {
            display: grid;
            place-items: center;
            min-height: 0;
        }

        #screen {
            width: min(100vw, calc(100vh - 37px) * 256 / 240);
            height: min(calc(100vw * 240 / 256), calc(100vh - 37px));
            image-rendering: pixelated;
            background: #000;
            outline: none;
        }

        #rom {
            display: none;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="menu"></div>
    <div id="screenWrap">
        <canvas id="screen" width="256" height="240" tabindex="0"></canvas>
    </div>
</div>
<input id="rom" type="file" accept=".nes,application/octet-stream">
<script src="cartridgevm.js"></script>
</body>
</html>

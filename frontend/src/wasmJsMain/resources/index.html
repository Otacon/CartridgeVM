<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CartridgeVM NES</title>
    <style>
        html, body, #app {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #101014;
            color: #f6f2e8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow: hidden;
        }

        .shell {
            display: grid;
            grid-template-rows: 28px minmax(0, 1fr);
            width: 100%;
            height: 100%;
        }

        .menubar {
            display: flex;
            align-items: stretch;
            gap: 2px;
            height: 28px;
            padding: 0 6px;
            background: #191922;
            border-bottom: 1px solid #333341;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        .menu {
            position: relative;
        }

        .menu-title {
            height: 27px;
            padding: 0 10px;
            border: 0;
            background: transparent;
            color: #f6f2e8;
            cursor: default;
            font: inherit;
            font-size: 12px;
        }

        .menu-title:hover,
        .menu:focus-within .menu-title {
            background: #303040;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 28px;
            left: 0;
            min-width: 160px;
            padding: 4px 0;
            background: #f6f2e8;
            color: #101014;
            border: 1px solid #7c7c86;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            z-index: 20;
        }

        .menu:hover .dropdown,
        .menu:focus-within .dropdown {
            display: block;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 6px 22px;
            border: 0;
            background: transparent;
            color: #101014;
            font: inherit;
            font-size: 12px;
            text-align: left;
            white-space: nowrap;
        }

        .menu-item:hover {
            background: #8fd7ff;
        }

        .separator {
            height: 1px;
            margin: 4px 0;
            background: #c8c3b8;
        }

        .status {
            margin-left: auto;
            align-self: center;
            max-width: 55vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.85;
            font-size: 12px;
        }

        .screen-wrap {
            display: grid;
            place-items: center;
            min-height: 0;
        }

        #screen {
            width: min(100vw, calc(100vh - 29px) * 256 / 240);
            height: min(calc(100vw * 240 / 256), calc(100vh - 29px));
            image-rendering: pixelated;
            background: #000;
            outline: none;
        }

        #rom {
            display: none;
        }
    </style>
</head>
<body>
<div id="app"></div>
<input id="rom" type="file" accept=".nes,application/octet-stream">
<script src="cartridgevm.js"></script>
</body>
</html>
